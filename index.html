<!doctype html>
<html lang="vi">
<head>
<title>Wheel Fit Guide</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: giao diện tool ở giữa như "hành tinh", thẻ chú thích đánh số quỹ đạo 2 bên, nối bằng số pin */
:root{
  --bg:#eef1f5; --panel:#ffffff; --fg:#1b2230; --muted:#5d6878; --line:#d4dae3;
  --accent:#1976d2; --accent2:#64b5f6; --pin-fg:#fff;
  --display:"Be Vietnam Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2228;--panel:#2a2e36;--fg:#e8ebf0;--muted:#9aa3b2;--line:#3a404b;--accent:#3a8ee6;--accent2:#64b5f6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f2228;--panel:#2a2e36;--fg:#e8ebf0;--muted:#9aa3b2;--line:#3a404b;--accent:#3a8ee6;--accent2:#64b5f6;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
header h1{font-size:clamp(28px,4vw,44px);font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
header p{color:var(--muted);margin:6px 0 0;max-width:65ch}
.tag{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.orbit{position:relative;display:grid;grid-template-columns:1fr minmax(0,530px) 1fr;gap:20px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;transition:border-color .15s,transform .15s;cursor:default}
.card h3{margin:0;font-size:14.5px}
.card p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card.on{border-color:#ffb300;transform:translateX(var(--nudge,0))}
#L .card.on{--nudge:6px}#R .card.on{--nudge:-6px}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--pin-fg);font:600 12px/24px var(--mono);text-align:center}
.shot{position:relative;max-width:100%}
.shot img{display:block;width:100%;border-radius:8px;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent2) 25%,transparent),0 20px 50px rgba(0,0,0,.3)}
.zone{position:absolute;border-radius:6px;transition:box-shadow .25s,outline-color .25s;outline:2px solid transparent;cursor:pointer}
.zone:hover{outline-color:color-mix(in srgb,var(--accent2) 60%,transparent)}
.zone.on{outline:2px solid #ffb300;box-shadow:0 0 18px 4px rgba(255,179,0,.6);z-index:2}
.dim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .25s;z-index:1}.dim.on{opacity:1}
.card.on{background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
code{font-family:var(--mono);font-size:12px;background:color-mix(in srgb,var(--accent) 12%,transparent);padding:1px 5px;border-radius:4px}
section h2{font-size:22px;margin:0 0 12px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.step b{font-family:var(--mono);color:var(--accent);font-size:12px}
.step h3{margin:4px 0;font-size:15px}.step p{margin:0;font-size:13px;color:var(--muted)}
.names{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;background:var(--panel);border-radius:10px;overflow:hidden;font-size:13px}
td,th{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent2) 22%,transparent),0 20px 50px rgba(0,0,0,.3),0 0 30px 0 color-mix(in srgb,var(--accent2) 15%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent2) 32%,transparent),0 20px 50px rgba(0,0,0,.3),0 0 46px 6px color-mix(in srgb,var(--accent2) 35%,transparent)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(255,179,0,.6)}70%{box-shadow:0 0 0 9px rgba(255,179,0,0)}}
@keyframes blink{50%{opacity:.3}}
header .tag::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#43c06b;margin-right:8px;animation:blink 1.8s infinite}
header h1{background:linear-gradient(100deg,var(--fg) 40%,var(--accent) 50%,var(--fg) 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s ease-in-out 1s infinite}
@keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.shot img{animation:pop .7s ease both,glow 4.5s ease-in-out .7s infinite}
.card{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*60ms + 150ms)}
.card.on .num{animation:beat 1.2s infinite;background:#ff9800}
.card{transition:border-color .2s,transform .25s cubic-bezier(.2,.7,.2,1),background .2s,box-shadow .2s}
.card:hover,.card.on{box-shadow:0 6px 18px rgba(0,0,0,.18)}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
#lines path{fill:none;stroke:#ffb300;stroke-width:2;stroke-dasharray:6 6;animation:flow .9s linear infinite;filter:drop-shadow(0 0 4px rgba(255,179,0,.7))}
#lines circle{fill:#ffb300;filter:drop-shadow(0 0 5px rgba(255,179,0,.9))}
.zone{transition:box-shadow .3s,outline-color .3s,background .3s}
.zone.on{background:rgba(255,179,0,.10)}
.zone:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bgwheels{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;color:var(--line)}
.bw{position:absolute;opacity:.55}
.bw svg{display:block;width:100%;height:100%}
.bw1{width:min(760px,90vw);aspect-ratio:1;right:-14vw;top:-12vh;animation:spin 120s linear infinite}
.bw2{width:min(540px,70vw);aspect-ratio:1;left:-12vw;bottom:-18vh;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;z-index:1}
.card{position:relative;z-index:1}
.card.on{z-index:30}
.illus{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:8;background:var(--panel);border:1px solid #ffb300;border-radius:10px;padding:10px 12px 8px;box-shadow:0 14px 30px rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .25s,visibility .25s;pointer-events:none}
.card.on .illus{opacity:1;visibility:visible;transform:none}
.illus svg{display:block;width:100%;height:auto}
.illus small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.i-tire{fill:color-mix(in srgb,var(--fg) 72%,var(--panel))}
.i-rim{fill:var(--accent2);stroke:var(--accent);stroke-width:1}
.i-t{font:500 9px var(--mono);fill:var(--panel)}.i-d{fill:#0b2a4a}
.i-ext{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;fill:none}
.i-arr{stroke:#ff9800;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.i-lbl{font:600 10px var(--mono);fill:#ff9800}
@media (max-width:1000px){#lines{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1000px){.orbit{grid-template-columns:1fr}.shot{order:-1;margin:0 auto}}
html{color-scheme:light dark}body{margin:0;font-size:14px}
</style>


</head>

<script>
const W=530,H=568;
const D=[
 [1,[[8,38,514,40]],"Bánh trước / Bánh sau","Chọn objects wheel đã đặt đúng tên (wheel,tire,motion...) tool tự đo ra thông số,chắc ăn thì bấm đo lại."],
 [2,[[10,102,150,50],[272,102,150,50]],"Mã vỏ hiện tại","Thông số kích thước hiện tại của wheel."],
 [3,[[162,102,100,50],[424,102,100,50]],"Đường kính hiện tại","Đường kính hiện tại của wheel."],
 [4,[[10,188,252,40],[272,188,252,40]],"Điền thông số mới","Nhập thông số kích thước mới để scale."],
 [5,[[160,162,100,20],[10,232,252,40],[422,162,100,20],[272,232,252,40]],"Đường kính","Bật lên để điền thêm thông số đường kính nếu cần."],
 [6,[[10,288,125,24],[272,288,125,24]],"Rim lip","Là dộ dày phần rim nhô ra ngoài mép vỏ."],
 [7,[[143,288,118,24],[405,288,118,24]],"Caliper + Emissive","Tick để scale cả caliper, emissive."],
 [8,[[11,318,68,34],[273,318,68,34]],"Tạo Wheel box","Là tạo dimensions wheel."],
 [9,[[81,318,182,34],[343,318,182,34]],"Scale bánh","Scale wheels theo thông số mới nhập."],
 [10,[[10,364,182,24],[272,364,182,24]],"Mã vỏ mới","Thông số kích thước wheel sau khi scale."],
 [11,[[225,365,34,32],[487,365,34,32]],"Xoay bánh","Check lắc."],
 [12,[[10,405,512,70]],"Kích thước tổng thể xe","Nhập thông số Dimensions, wheelbase."],
 [13,[[11,484,172,34]],"Tạo Box Dimensions + Wheelbase","Tạo Dimensions_Box và Center_Box (wheelbase)."],
 [14,[[186,484,150,34]],"Đặt bánh theo trục cơ sở","Move wheel tới vị trí wheelbase."],
 [15,[[341,483,174,38]],"Lật bánh tráng","Mirror wheels."],
 [16,[[8,544,514,22]],"Thanh trạng thái","Thông báo chi tiết trạng thái."]
];
const L=document.getElementById('L'),R=document.getElementById('R'),S=document.getElementById('shot');
D.forEach(([n,rs,h,p])=>{
  const c=document.createElement('div');c.className='card';c.style.setProperty('--i',n);c.dataset.n=n;c.tabIndex=0;
  c.innerHTML=`<span class="num">${n}</span><div><h3>${h}</h3><p>${p}</p></div>`;
  if(n===6)c.insertAdjacentHTML('beforeend',`<div class="illus"><svg viewBox="0 0 240 150" role="img" aria-label="Mặt cắt bánh xe: rim nhô ra khỏi mép vỏ"><rect x="40" y="18" width="160" height="62" rx="18" class="i-tire"/><text x="120" y="44" class="i-t" text-anchor="middle">VỎ (tire)</text><rect x="26" y="68" width="188" height="16" class="i-rim"/><rect x="26" y="56" width="9" height="28" rx="2" class="i-rim"/><rect x="205" y="56" width="9" height="28" rx="2" class="i-rim"/><text x="120" y="80.5" class="i-t i-d" text-anchor="middle">RIM</text><path d="M40 50V112M26 84V112" class="i-ext"/><path d="M26 104H40" class="i-arr"/><path d="M30 100l-4 4 4 4M36 100l4 4-4 4" class="i-arr"/><text x="33" y="128" class="i-lbl" text-anchor="middle">Rim lip</text><path d="M214 84V112M200 50V112" class="i-ext"/><path d="M200 104H214" class="i-arr"/><path d="M204 100l-4 4 4 4M210 100l4 4-4 4" class="i-arr"/><text x="207" y="128" class="i-lbl" text-anchor="middle">Rim lip</text><text x="120" y="144" class="i-t" text-anchor="middle">rim nhô ra khỏi mép vỏ</text></svg></div>`);
  (n<=8?L:R).appendChild(c);
  rs.forEach(([x,y,w,hh],i)=>{const z=document.createElement('div');z.className='zone'+(i?' sub':'');z.dataset.n=n;z.title=h;
    Object.assign(z.style,{left:x/W*100+'%',top:y/H*100+'%',width:w/W*100+'%',height:hh/H*100+'%'});S.appendChild(z);});
});
const SV=document.createElementNS('http://www.w3.org/2000/svg','svg');SV.setAttribute('class','dim');SV.setAttribute('viewBox',`0 0 ${W} ${H}`);SV.setAttribute('preserveAspectRatio','none');
const PA=document.createElementNS('http://www.w3.org/2000/svg','path');PA.setAttribute('fill','rgba(10,14,22,.6)');PA.setAttribute('fill-rule','evenodd');SV.appendChild(PA);S.appendChild(SV);
const hi0=n=>{const d=D.find(x=>x[0]==n);SV.classList.toggle('on',!!d);if(d)PA.setAttribute('d',`M0 0H${W}V${H}H0Z`+d[1].map(([x,y,w,h])=>`M${x} ${y}h${w}v${h}h${-w}Z`).join(''));};
const O=document.querySelector('.orbit');const NS='http://www.w3.org/2000/svg';
const LS=document.createElementNS(NS,'svg');LS.id='lines';O.appendChild(LS);let curN=0;
function lines(n){LS.innerHTML='';if(!n||innerWidth<=1000)return;
 const card=document.querySelector('.card[data-n="'+n+'"]'),o=O.getBoundingClientRect(),c=card.getBoundingClientRect();
 const left=card.parentElement.id==='L',sx=(left?c.right:c.left)-o.left,sy=c.top+c.height/2-o.top;
 document.querySelectorAll('.zone[data-n="'+n+'"]').forEach(z=>{const r=z.getBoundingClientRect();
  const ex=(sx<r.left+r.width/2?r.left:r.right)-o.left,ey=r.top+r.height/2-o.top,dx=(ex-sx)/2;
  const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${sx} ${sy}C${sx+dx} ${sy} ${ex-dx} ${ey} ${ex} ${ey}`);
  const d=document.createElementNS(NS,'circle');d.setAttribute('cx',ex);d.setAttribute('cy',ey);d.setAttribute('r',4.5);LS.append(p,d);});}
const hi=n=>{curN=n;lines(n);hi0(n);document.querySelectorAll('[data-n]').forEach(e=>e.classList.toggle('on',e.dataset.n==n));};
document.querySelectorAll('[data-n]').forEach(e=>{
  e.addEventListener('mouseenter',()=>hi(e.dataset.n));e.addEventListener('mouseleave',()=>hi(0));
  e.addEventListener('focus',()=>hi(e.dataset.n));e.addEventListener('blur',()=>hi(0));
  if(e.classList.contains('zone'))e.addEventListener('click',()=>{const c=document.querySelector('.card[data-n="'+e.dataset.n+'"]');if(innerWidth<1000)c.scrollIntoView({behavior:'smooth',block:'center'})});
});

addEventListener('resize',()=>lines(curN));
